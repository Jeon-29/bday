<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Celebrant Mail</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  </style>
</head>
<body class="h-screen w-screen bg-slate-100 flex flex-col font-sans select-none overflow-hidden">

  <!-- PIN LOCK SCREEN OVERLAY -->
  <div id="pin-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-xs w-full text-center space-y-5">
      <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mx-auto">
        <i data-lucide="lock" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-slate-800">Private Mailbox</h2>
        <p class="text-xs text-slate-500 mt-1">Enter PIN to access messages</p>
      </div>
      <input type="password" id="pin-input" maxlength="6" placeholder="Enter PIN" class="w-full text-center tracking-widest text-lg py-2 bg-slate-100 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500">
      <button onclick="verifyPin()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow">Unlock Inbox</button>
    </div>
  </div>

  <!-- MACOS MAIL APP INTERFACE -->
  <!-- Top App Toolbar -->
  <header class="h-12 bg-slate-200/90 border-b border-slate-300/80 flex items-center justify-between px-4">
    <div class="flex items-center space-x-3">
      <!-- Traffic Lights -->
      <div class="flex space-x-1.5">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <div class="w-3 h-3 rounded-full bg-green-500"></div>
      </div>
      <span class="font-bold text-xs text-slate-700 ml-2" id="app-header-title">Celebrant Mail</span>
    </div>

    <!-- Search Bar -->
    <div class="relative w-64">
      <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" id="search-input" onkeyup="filterMessages()" placeholder="Search sender or wish..." class="w-full pl-8 pr-3 py-1 bg-white/80 border border-slate-300/80 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-purple-500">
    </div>

    <div class="flex items-center space-x-2 text-xs">
      <span class="bg-purple-100 text-purple-700 font-bold px-2.5 py-1 rounded-full text-[10px]" id="total-messages-badge">0 Messages</span>
    </div>
  </header>

  <!-- Main Split-Pane Mail View -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT SIDEBAR: FOLDERS -->
    <aside class="w-52 bg-slate-200/60 border-r border-slate-300/70 p-3 space-y-4 flex-shrink-0">
      <div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2 mb-1">Mailboxes</div>
        <nav class="space-y-1 text-xs font-semibold text-slate-700">
          <button class="w-full flex items-center justify-between px-2.5 py-1.5 bg-purple-600 text-white rounded-lg shadow-sm">
            <div class="flex items-center space-x-2">
              <i data-lucide="inbox" class="w-4 h-4"></i>
              <span>Inbox</span>
            </div>
            <span id="sidebar-count" class="text-[10px] bg-white/20 px-1.5 py-0.5 rounded-full">0</span>
          </button>
          <button class="w-full flex items-center space-x-2 px-2.5 py-1.5 hover:bg-slate-300/50 rounded-lg">
            <i data-lucide="star" class="w-4 h-4 text-yellow-500"></i>
            <span>Favorites</span>
          </button>
        </nav>
      </div>
    </aside>

    <!-- MIDDLE LIST: MESSAGE PREVIEWS -->
    <section class="w-80 bg-white border-r border-slate-200 flex flex-col overflow-y-auto" id="message-list-pane">
      <!-- Dynamically filled with message cards -->
    </section>

    <!-- RIGHT READER: FULL EMAIL CONTENT VIEW -->
    <main class="flex-1 bg-white flex flex-col p-8 overflow-y-auto" id="message-reader-pane">
      <div class="my-auto text-center text-slate-400 space-y-2">
        <i data-lucide="mail-open" class="w-12 h-12 mx-auto opacity-30"></i>
        <p class="text-sm font-medium">Select a message from the list to read</p>
      </div>
    </main>

  </div>

  <script>
    /* CONFIGURATION */
    const CELEBRANT_NAME = "Celebrant";
    const CELEBRANT_PIN = "1234"; // <-- Celebrant Access PIN

    /* FIREBASE CONFIGURATION */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    let allMessages = [];

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      document.getElementById('app-header-title').innerText = `${CELEBRANT_NAME}'s Mailbox`;

      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    });

    function verifyPin() {
      const pin = document.getElementById('pin-input').value;
      if (pin === CELEBRANT_PIN) {
        document.getElementById('pin-modal').classList.add('hidden');
        loadMessages();
      } else {
        alert("Incorrect PIN.");
      }
    }

    function loadMessages() {
      if (db) {
        db.ref('birthday_messages').on('value', (snapshot) => {
          const data = snapshot.val();
          allMessages = [];
          if (data) {
            Object.keys(data).forEach(key => {
              allMessages.unshift({ id: key, ...data[key] });
            });
          }
          renderMessageList(allMessages);
        });
      } else {
        allMessages = JSON.parse(localStorage.getItem('bday_msgs') || '[]');
        renderMessageList(allMessages);
      }
    }

    function renderMessageList(messages) {
      const listPane = document.getElementById('message-list-pane');
      document.getElementById('total-messages-badge').innerText = `${messages.length} Messages`;
      document.getElementById('sidebar-count').innerText = messages.length;

      if (messages.length === 0) {
        listPane.innerHTML = `<div class="p-8 text-center text-xs text-slate-400">No birthday messages yet.</div>`;
        return;
      }

      listPane.innerHTML = messages.map(msg => `
        <div onclick="readMessage('${msg.id}')" class="p-4 border-b border-slate-100 hover:bg-purple-50/50 cursor-pointer transition">
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-slate-800 text-xs truncate flex items-center space-x-1.5">
              <span>${msg.sticker}</span>
              <span>${msg.sender}</span>
            </span>
            <span class="text-[10px] text-slate-400">${msg.timestamp}</span>
          </div>
          <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${msg.message}</p>
        </div>
      `).join('');
    }

    function readMessage(id) {
      const msg = allMessages.find(m => m.id == id);
      if (!msg) return;

      const readerPane = document.getElementById('message-reader-pane');
      readerPane.innerHTML = `
        <div class="max-w-xl mx-auto w-full space-y-6">
          <div class="flex items-start justify-between border-b border-slate-100 pb-4">
            <div class="flex items-center space-x-3">
              <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-2xl font-bold shadow-sm">
                ${msg.sticker}
              </div>
              <div>
                <h1 class="text-base font-bold text-slate-800">${msg.sender}</h1>
                <p class="text-xs text-slate-400">Sent to ${CELEBRANT_NAME} • ${msg.timestamp}</p>
              </div>
            </div>
            <button onclick="deleteMessage('${msg.id}')" class="text-red-500 hover:text-red-700 p-2 rounded-lg hover:bg-red-50">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="bg-slate-50 border border-slate-200/80 p-6 rounded-2xl text-slate-700 text-sm leading-relaxed whitespace-pre-wrap font-sans shadow-sm">
            ${msg.message}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function deleteMessage(id) {
      if (confirm("Delete this birthday wish?")) {
        if (db) {
          db.ref('birthday_messages/' + id).remove();
        } else {
          allMessages = allMessages.filter(m => m.id != id);
          localStorage.setItem('bday_msgs', JSON.stringify(allMessages));
          renderMessageList(allMessages);
        }
        document.getElementById('message-reader-pane').innerHTML = `<div class="my-auto text-center text-slate-400 text-sm">Select a message to read</div>`;
      }
    }

    function filterMessages() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allMessages.filter(m => m.sender.toLowerCase().includes(query) || m.message.toLowerCase().includes(query));
      renderMessageList(filtered);
    }
  </script>
</body>
</html>
